[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodev"
version = "0.1.0"
description = "A small, inspectable autonomous coding agent core"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
autodev = "autodev.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: executes the real Docker C++ sandbox",
]

[tool.setuptools.packages.find]
include = ["autodev*"]
